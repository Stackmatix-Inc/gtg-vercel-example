# .pre-commit-config.yaml
# Generated by axc-project-setup. Re-run the skill to regenerate (it won't
# clobber an existing file — delete it first if you want a clean rewrite).
#
# Install / update hooks: `pre-commit install && pre-commit autoupdate`
# Run on every file:     `pre-commit run --all-files`

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Project gates. Run through pnpm so they use the repo's pinned toolchain.
  # Run `pnpm install` before the first commit.
  - repo: local
    hooks:
      - id: lint
        name: eslint (pnpm lint)
        entry: pnpm lint
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx]
      - id: typecheck
        name: tsc (pnpm typecheck)
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        types_or: [ts, tsx, json]
      - id: test
        name: vitest (pnpm test)
        entry: pnpm test
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx]
